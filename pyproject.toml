[project]
name = "obc-panel-deployment-tests"
version = "0.1.0"
description = "SIL/HIL pytest tests for OBC panel deployment (ICEYE-style exercise)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: domain model without SSH",
    "integration: tests against OBC over SSH",
]
