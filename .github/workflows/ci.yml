name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -m unit --tb=short

  integration:
    name: Integration tests (SIL / Docker)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: pip install -e ".[dev]"

      - name: Start OBC container
        run: docker compose up --build -d

      - name: Wait for SSH port
        run: |
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/2222' 2>/dev/null; then
              echo "OBC SSH is up"
              exit 0
            fi
            sleep 2
          done
          echo "OBC SSH did not become ready"
          docker compose logs obc
          exit 1

      - name: Run integration tests
        run: pytest tests/integration -m integration --tb=short

      - name: Show OBC logs on failure
        if: failure()
        run: docker compose logs obc
